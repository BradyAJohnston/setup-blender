name: "Setup Blender"
description: "Downloads and installs Blender for use in GitHub Actions"
inputs:
  version:
    description: "Blender version to install: semantic (e.g. 4.2 or 4.2.1), or special values: daily | latest"
    required: false
    default: "latest"

runs:
  using: "composite"
  steps:
    - name: Install uv
      # setup-uv stopped publishing floating major tags after v7 — pin exact
      uses: astral-sh/setup-uv@v10.0.1
      with:
        version: "latest"
    - name: Set version variables
      shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}
      run: |
        uv run ${{ github.action_path }}/scripts/set_versions.py ${{ inputs.version }}

    - name: Restore Blender from cache
      id: cache-blender
      if: env.CACHE_VERSION != '' || env.CACHE_FALLBACK != ''
      uses: actions/cache/restore@v6
      with:
        path: |
          blender-download.*
        # when the version couldn't be resolved, fall back to the newest cached
        # build of the requested series (CACHE_FALLBACK is only set then)
        key: blender-${{ runner.os }}-${{ runner.arch }}-${{ env.CACHE_VERSION || 'unresolved' }}
        restore-keys: ${{ env.CACHE_FALLBACK != '' && format('blender-{0}-{1}-{2}', runner.os, runner.arch, env.CACHE_FALLBACK) || '' }}

    - name: Install Blender Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if [ ! -f "blender-download.tar.xz" ]; then
          if [ -z "${FULL_VERSION}" ]; then
            echo "::error::Could not resolve the Blender version and there is no cached build to fall back to"
            exit 1
          fi
          if [ "${IS_DAILY}" == "true" ]; then
            url=$BLEND_URL_LINUX_X64
          else
            url=${BLENDER_RELEASE_URL}Blender${BLENDER_BASE_VERSION}/blender-${FULL_VERSION}-linux-x64.tar.xz
          fi
          wget -nv --tries=5 --waitretry=10 --retry-connrefused --retry-on-http-error=403,429,500,502,503,504 "$url" -O ./blender-download.tar.xz
        else
          echo "Using cached Blender download"
        fi
        mkdir -p ../blender
        tar -xf ./blender-download.tar.xz -C ../blender --strip-components=1
        echo "$GITHUB_WORKSPACE/../blender" >> $GITHUB_PATH

    - name: Install Blender MacOS ARM
      if: runner.os == 'macOS'
      shell: bash
      run: |
        if [ ! -f "blender-download.dmg" ]; then
          if [ -z "${FULL_VERSION}" ]; then
            echo "::error::Could not resolve the Blender version and there is no cached build to fall back to"
            exit 1
          fi
          if [ "${IS_DAILY}" == "true" ]; then
            url=$BLEND_URL_MACOS_ARM64
          else
            url=${BLENDER_RELEASE_URL}Blender${BLENDER_BASE_VERSION}/blender-${FULL_VERSION}-macos-arm64.dmg
          fi
          curl -L --fail --retry 5 --retry-delay 10 --retry-all-errors -o blender-download.dmg "$url"
        else
          echo "Using cached Blender download"
        fi
        hdiutil attach blender-download.dmg
        cp -R /Volumes/Blender/Blender.app /Applications/
        hdiutil detach /Volumes/Blender
        echo "/Applications/Blender.app/Contents/MacOS" >> $GITHUB_PATH

    - name: Install Blender Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        if (-not (Test-Path "blender-download.zip")) {
          if (-not $env:FULL_VERSION) {
            Write-Host "::error::Could not resolve the Blender version and there is no cached build to fall back to"
            exit 1
          }
          if ($env:IS_DAILY -eq $true) {
            $url = $env:BLEND_URL_WINDOWS_X64
          } else {
            $url = "${env:BLENDER_RELEASE_URL}Blender${env:BLENDER_BASE_VERSION}/blender-${env:FULL_VERSION}-windows-x64.zip"
          }
          Invoke-WebRequest -Uri $url -OutFile "blender-download.zip" -MaximumRetryCount 5 -RetryIntervalSec 10
        } else {
          Write-Host "Using cached Blender download"
        }
        Expand-Archive -Path "blender-download.zip" -DestinationPath "temp"
        $blenderDir = Get-ChildItem -Path "temp" | Select-Object -First 1
        Move-Item -Path $blenderDir.FullName -Destination "../blender"
        Remove-Item -Path "temp"
        echo "$env:GITHUB_WORKSPACE/../blender" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Save Blender to cache
      if: env.CACHE_VERSION != '' && steps.cache-blender.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          blender-download.*
        key: blender-${{ runner.os }}-${{ runner.arch }}-${{ env.CACHE_VERSION }}
